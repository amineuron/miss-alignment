general:
  # MissAlignment iteratively trains models and realigns the tilt-series
  training_directory: /data/set/  # path to directory for writing iteration output
  apply_ctf: False                # global default; can be overridden per iteration below (apply_ctf:)
  # Default reconstruction oversampling (FFT zero-padding), used identically in
  # training-pool generation and the alignment closure. The reconstructed volume
  # is (patch_size * oversampling) per axis, so FFT cost scales ~oversampling^3.
  # Overridable per iteration below; A/B against the alignment loss before lowering.
  reconstruction_oversampling: 2.0
  iteration_settings:             # defines all iterations to run (length determines number of iterations)
    # alignment modes: "global" (single pass), "anchoring" (iterative), "spline" (coarse-to-fine)
    # Optional per-iteration `oversampling` and `apply_ctf` override the general
    # defaults -- a coarse-to-fine fidelity curriculum: cheap early, full + CTF at
    # the end where final quality is set. Both fall back to the general values if
    # a row omits them, so deleting these keys reproduces the original behaviour.
    - { downsample: 3, alignment: anchoring, oversampling: 1.25 }
    - { downsample: 2, alignment: anchoring, oversampling: 1.25 }
    - { downsample: 1, alignment: global,    oversampling: 1.5 }
    - { downsample: 1, alignment: global,    oversampling: 1.5 }
    - { downsample: 1, alignment: [3, 3],    oversampling: 2.0 }  # local 3x3 image warp
    - { downsample: 1, alignment: [3, 3],    oversampling: 2.0 }
    - { downsample: 1, alignment: [3, 3],    oversampling: 2.0, apply_ctf: true }  # full fidelity + CTF
    - { downsample: 1, alignment: [3, 3],    oversampling: 2.0, apply_ctf: true }
  seed: 45132

model_training:
  # used to initialize model weights
  model_architecture: 'default'
  model_checkpoint: null  # only used as initialization for iteration 0
  loss_margin: 0.5
  learning_rate: 1.0e-3
  # Set to zero to disable weight decay (i.e. the AdamW optimizer)
  weight_decay: 1.0e-4
  max_epochs_per_iteration: 30  # absolute maximum of stopping
  warmup_steps: 500
  multistep_lr_scheduler:
    milestones: [5, 15]
    gamma: 0.5                  # multiply learning rate by this value at the milestone epochs

data_loading:
  batch_size: 32                  # these value have been used as defaults:
  patch_size: 96                  # batch size 32 | reconstruction size 128 ^ 3
  steps_per_epoch: 1000           # this defines the size of an epoch

# this configures the shift generation for the contrastive training of MissAlignment
# all parameters are in units of pixels, thus shifts become larger when downsampling
shift_generation:
  trajectory_probability: .5      # these make bananas and birds
  trajectory_max_shift: 10.0      # trajectories fall somewhere between +/- f
  jitter_probability: .5
  jitter_max_std: 2.0             # maximum standard deviation of a normal distribution
  outlier_probability: .5
  outlier_max_shift: 20.0         # outlier can maximally go to this value
  fracture_probability: .5
  fracture_max_shift: 20.0       # specific strong shifts for high tilt images up to this value

tilt_series_alignment:
  patch_size: 96      # same as training patch size
  patch_overlap: 0.1  # tolerated overlap between patches used for optimizing the alignment
  batch_size: 32      # amount of patches simultaneously reconstructed in memory -> the more the merrier
  # --- optional speed knobs; omit any/all of these for the original behaviour ---
  # Caps for the LBFGS strong-Wolfe line search. Every closure evaluation
  # reconstructs the whole patch grid (the dominant alignment cost), so lower
  # values trade a little convergence for far fewer reconstructions. Omit this
  # block entirely to use PyTorch's defaults (max_iter: 20, history_size: 100).
  lbfgs_options:
    max_iter: 6
    history_size: 10
  # "anchoring" mode promotes this many tilts per side to "reliable" each step.
  # 1 reproduces the original schedule (~n_tilts/4 full optimizer solves); larger
  # values run proportionally fewer solves and are reverted automatically if the
  # loss worsens, so the accuracy risk is bounded.
  anchoring_expand_per_step: 2
  # Fraction of grid positions to keep, ranked by patch variance. Empty vitreous
  # ice is ~flat, so dropping the lowest-variance patches removes reconstructions
  # the precision-weighted score already ignores. 1.0 keeps everything (default);
  # e.g. 0.6 drops the emptiest 40%. Tune per dataset (start conservative).
  foreground_keep_fraction: 1.0
